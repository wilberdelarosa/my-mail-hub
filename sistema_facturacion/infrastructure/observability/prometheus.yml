global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'alito-local'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kong API Gateway metrics
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'

  # RabbitMQ metrics
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Redis metrics (requiere redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (Supabase integrado)
  - job_name: 'postgres'
    static_configs:
      - targets: ['host.docker.internal:54322']
    metrics_path: '/metrics'

  # Microservicios (agregar cuando estén listos)
  # - job_name: 'quotation-service'
  #   static_configs:
  #     - targets: ['quotation-service:3002']
  #   metrics_path: '/metrics'
  
