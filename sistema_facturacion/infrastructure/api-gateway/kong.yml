_format_version: "3.0"
_transform: true

# ============================================
# API Gateway Kong - ALITO GROUP
# ============================================
# Enruta tráfico a:
# - Supabase PostgREST (CRUD automático)
# - Microservicios custom (Hexagonal + Swagger)

services:
  # ==========================================
  # SUPABASE PostgREST
  # ==========================================
  - name: supabase-rest
    url: http://host.docker.internal:54321
    routes:
      - name: supabase-rest-route
        paths:
          - /rest
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://127.0.0.1:3000"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  # ==========================================
  # AUTH Service (Supabase GoTrue)
  # ==========================================
  - name: supabase-auth
    url: http://host.docker.internal:54321
    routes:
      - name: supabase-auth-route
        paths:
          - /auth
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
          credentials: true

  # ==========================================
  # STORAGE Service (Supabase Storage)
  # ==========================================
  - name: supabase-storage
    url: http://host.docker.internal:54321
    routes:
      - name: supabase-storage-route
        paths:
          - /storage
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
          credentials: true

