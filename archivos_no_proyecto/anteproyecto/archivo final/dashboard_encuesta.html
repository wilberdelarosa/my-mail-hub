<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Resultados de la encuesta - ALITO GROUP SRL</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 20px auto;
    }
    h1, h2 {
      text-align: center;
    }
    .chart-container {
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
    }
  </style>
</head>
<body>
  <h1>Resultados de la encuesta</h1>
  <h2>ALITO GROUP SRL</h2>

  <!-- Gráfico de barras: Medias por ítem -->
  <div class="chart-container">
    <h3>Figura 1. Medias de los ítems Likert (1–7)</h3>
    <canvas id="chartMedias"></canvas>
    <button onclick="exportChart('chartMedias', 'figura1_medias_items.png')">
      Exportar Figura 1 (PNG)
    </button>
  </div>

  <!-- Gráfico de barras: Frecuencia de errores -->
  <div class="chart-container">
    <h3>Figura 2. Frecuencia de errores reportados</h3>
    <canvas id="chartErrores"></canvas>
    <button onclick="exportChart('chartErrores', 'figura2_errores.png')">
      Exportar Figura 2 (PNG)
    </button>
  </div>

  <!-- Gráfico de pastel: Disposición a capacitarse -->
  <div class="chart-container">
    <h3>Figura 3. Disposición a capacitarse en el nuevo sistema</h3>
    <canvas id="chartCapacitacion"></canvas>
    <button onclick="exportChart('chartCapacitacion', 'figura3_disposicion_capacitacion.png')">
      Exportar Figura 3 (PNG)
    </button>
  </div>

  <script>
    // Datos de ejemplo (reemplaza con datos reales cuando los tengas)
    const etiquetasItems = [
      'Ítem 1', 'Ítem 2', 'Ítem 3',
      'Ítem 4', 'Ítem 5', 'Ítem 6', 'Ítem 7'
    ];
    const mediasItems = [2.3, 4.1, 2.7, 2.1, 4.6, 4.8, 3.8];

    // Gráfico 1: Medias por ítem (barras)
    const ctxMedias = document.getElementById('chartMedias').getContext('2d');
    new Chart(ctxMedias, {
      type: 'bar',
      data: {
        labels: etiquetasItems,
        datasets: [{
          label: 'Media (1–5)',
          data: mediasItems,
          backgroundColor: 'rgba(54, 162, 235, 0.6)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, max: 5 }
        }
      }
    });

    // Gráfico 2: Frecuencia de errores (ejemplo)
    const etiquetasErrores = [
      'Errores NCF',
      'Errores ITBIS',
      'Duplicidad de registros',
      'Otros'
    ];
    const frecuenciasErrores = [8, 6, 5, 2]; // valores de ejemplo

    const ctxErrores = document.getElementById('chartErrores').getContext('2d');
    new Chart(ctxErrores, {
      type: 'bar',
      data: {
        labels: etiquetasErrores,
        datasets: [{
          label: 'Frecuencia reportada',
          data: frecuenciasErrores,
          backgroundColor: 'rgba(255, 159, 64, 0.6)',
          borderColor: 'rgba(255, 159, 64, 1)',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });

    // Gráfico 3: Disposición a capacitarse (pastel)
    const etiquetasCapacitacion = [
      'Totalmente en desacuerdo',
      'En desacuerdo',
      'Neutral',
      'De acuerdo',
      'Totalmente de acuerdo'
    ];
    const datosCapacitacion = [0, 1, 1, 4, 6]; // ejemplo con 12 encuestados

    const ctxCapacitacion = document.getElementById('chartCapacitacion').getContext('2d');
    new Chart(ctxCapacitacion, {
      type: 'pie',
      data: {
        labels: etiquetasCapacitacion,
        datasets: [{
          data: datosCapacitacion,
          backgroundColor: [
            'rgba(255, 99, 132, 0.7)',
            'rgba(255, 159, 64, 0.7)',
            'rgba(255, 205, 86, 0.7)',
            'rgba(75, 192, 192, 0.7)',
            'rgba(54, 162, 235, 0.7)'
          ]
        }]
      },
      options: {
        responsive: true
      }
    });

    // Función para exportar cualquier gráfico a PNG
    function exportChart(canvasId, fileName) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = fileName;
      link.click();
    }
  </script>
</body>
</html>
